name: FinAI CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/end-to-end-finai
      - feature/professional-market-intelligence-v2
      - ai/finai-completion
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check for router model artifact
        id: router_artifact
        shell: bash
        run: |
          if [ -f "router/models/finai_router_tfidf.joblib" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full regression tests when router artifact is present
        if: steps.router_artifact.outputs.present == 'true'
        run: python -m pytest -q

      - name: Run artifact-independent regression tests
        if: steps.router_artifact.outputs.present != 'true'
        run: |
          python -m pytest -q \
            tests/test_api_main.py \
            tests/test_brain_status_api.py \
            tests/test_api_security.py \
            tests/test_finite_api_inputs.py \
            tests/test_execution_plan.py \
            tests/test_epcrp.py \
            tests/test_patent_mechanism_api.py \
            tests/test_resilient_pay_ledger.py \
            tests/test_counterfactual_screening.py \
            tests/test_counterfactual_stability.py \
            tests/test_counterfactual_stability_api.py \
            tests/test_capability_plan_integration.py \
            tests/test_finai_preflight.py \
            tests/test_provider_smoke_script.py \
            tests/test_rllm_offline_loading.py \
            tests/test_sarvam_offline_loading.py \
            tests/test_colibri_adapter.py \
            tests/test_rag_faiss_resume.py \
            tests/test_network_mode_enforcement.py \
            tests/test_cloud_provider_network_policy.py \
            tests/test_advanced_causal.py \
            tests/test_causal_risk.py \
            tests/test_new_api_routes.py \
            tests/test_research_upgrades.py \
            tests/test_feasibility_pruning.py \
            tests/test_constrained_gfnets.py \
            tests/test_patent_research_loop.py \
            tests/test_incremental_feasibility.py \
            tests/test_pruning_benchmark.py \
            tests/test_research_experiments.py \
            tests/test_global_investments.py \
            tests/test_causal_risk_api_fallback.py \
            tests/test_authority_contract.py \
            tests/test_claim_contract.py \
            tests/test_claim_extractor.py \
            tests/test_claim_verifier.py \
            tests/test_compliance_catalog.py \
            tests/test_crypto_api.py \
            tests/test_crypto_arbitrage.py \
            tests/test_crypto_scanner.py \
            tests/test_domain_router.py \
            tests/test_finance_encyclopedia.py \
            tests/test_finance_engine.py \
            tests/test_finance_services.py \
            tests/test_financial_catalog.py \
            tests/test_financial_parameters.py \
            tests/test_gemini_adapter.py \
            tests/test_gemini_provider.py \
            tests/test_generation_completeness.py \
            tests/test_interest_service_natural.py \
            tests/test_investment_catalog.py \
            tests/test_investment_parameters.py \
            tests/test_market_discovery.py \
            tests/test_market_domain_precedence.py \
            tests/test_market_news.py \
            tests/test_market_overview.py \
            tests/test_market_search_api.py \
            tests/test_model_gateway.py \
            tests/test_model_router.py \
            tests/test_model_api.py \
            tests/test_resource_orchestrator.py \
            tests/test_model_registry.py \
            tests/test_openai_provider.py \
            tests/test_openrouter_provider.py \
            tests/test_portfolio_engine.py \
            tests/test_portfolio_service.py \
            tests/test_qwen_embedding_adapter.py \
            tests/test_rag_evidence_verifier.py \
            tests/test_response_adapter.py \
            tests/test_response_adapter_verification.py \
            tests/test_response_engine.py \
            tests/test_response_provider_fallback.py \
            tests/test_task_aware_router.py \
            tests/test_verifier_gated_escalation.py \
            tests/test_response_service.py \
            tests/test_response_verifier.py \
            tests/test_risk_controller.py \
            tests/test_sarvam_lazy_loading.py \
            tests/test_session_auth.py \
            tests/test_session_xai.py \
            tests/test_specialist_gateway.py \
            tests/test_xai_api.py \
            tests/test_xai_claims.py \
            tests/test_xai_finance.py \
            tests/test_xai_model.py \
            tests/test_xai_portfolio.py \
            tests/test_xai_rag_trace.py

  research-benchmark:
    name: Patent mechanism benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic research benchmark
        run: python scripts/run_patent_mechanism_benchmark.py --output patent-benchmark.json
      - name: Run counterfactual feasibility screening smoke benchmark
        run: python benchmarks/counterfactual_screening_benchmark.py
      - name: Run seeded known-feasible stress benchmark
        run: python benchmarks/counterfactual_stress_benchmark.py --output counterfactual-stress-benchmark.json --cases 500

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: patent-mechanism-benchmark
          path: |
            patent-benchmark.json
            benchmarks/counterfactual_screening_benchmark.json
            counterfactual-stress-benchmark.json

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
